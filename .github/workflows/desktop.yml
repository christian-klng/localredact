name: Desktop build

# Builds the Electron app on all three target systems and checks that the
# packaged app starts and serves the UI.
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'src/**', 'package*.json', '.github/workflows/desktop.yml']
  push:
    paths: ['desktop/**', 'src/**', 'package*.json', '.github/workflows/desktop.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            run: desktop/dist/mac-arm64/LocalRedact.app/Contents/MacOS/LocalRedact --smoke
          - os: windows-latest
            run: desktop/dist/win-unpacked/LocalRedact.exe --smoke
          - os: ubuntu-latest
            run: xvfb-run -a desktop/dist/linux-unpacked/localredact --smoke --no-sandbox
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # onnxruntime-node tries to download CUDA binaries on Linux; the app runs
      # its model in the browser runtime and does not need them.
      npm_config_onnxruntime_node_install_cuda: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # The smoke test also converts a DOCX with the built-in renderer.
      LOCALREDACT_DOCX_ENGINE: builtin
      LOCALREDACT_SMOKE_DOCX: ${{ github.workspace }}/smoke.docx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create test DOCX
        run: python desktop/spikes/docx/make_docx.py smoke.docx
      - name: Install web app dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build server
        run: npm run build:server
        working-directory: desktop
      - name: Package app
        run: npm run pack
        working-directory: desktop
      - name: Smoke test packaged app
        shell: bash
        run: ${{ matrix.run }}
